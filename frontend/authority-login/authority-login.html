<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authority Login</title>

    <link rel="stylesheet" href="authority-login.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-info">

            <h1>SahaySetu</h1>

            <h2>Authority Portal</h2>

            <p>
                Manage civic complaints, assign workers,
                track progress and monitor issue resolution.
            </p>

            <div class="info-box">
                <span>✓</span>
                <p>Monitor Complaints</p>
            </div>

            <div class="info-box">
                <span>✓</span>
                <p>Assign Workers</p>
            </div>

            <div class="info-box">
                <span>✓</span>
                <p>Update Complaint Status</p>
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-box">

            <div class="login-icon">
                👤
            </div>

            <h2>Authority Login</h2>

            <p class="subtitle">
                Login to access your dashboard
            </p>


            <form id="loginForm">

                <label for="login">
                    Email ID / Phone Number
                </label>

                <input
                    type="text"
                    id="login"
                    placeholder="Enter your email ID or phone number"
                    autocomplete="username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        👁
                    </button>

                </div>


                <div class="login-options">

                    <label class="remember">
                        <input
                            type="checkbox"
                            id="rememberMe"
                        >
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <p class="demo-text" id="loginMessage">
                Login using your Authority account.
            </p>

        </div>

    </div>


    <script src="authority-login.js"></script>

</body>

</html>
